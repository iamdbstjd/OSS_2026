schema_version: v1

server:
  host: 127.0.0.1
  port: 8000

engine:
  default_latency_budget_ms: 200

planner:
  mode: rule
  feature_config: configs/query_features_v1.json
  rule_config: configs/rule_planner_v1.json

vector:
  backend: qdrant
  url: http://127.0.0.1:6333
  collection_prefix: ragplan_chunks
  dimension: 384
  distance: cosine

embedding:
  model_id: sentence-transformers/all-MiniLM-L6-v2
  revision: b8903db39f65d93ae28d49a37c4f3fa90c5f94e0
  local_files_only: true
  normalize_embeddings: true

chunking:
  tokenizer_window: 220
  tokenizer_overlap: 40

graph:
  backend: neo4j
  uri: bolt://127.0.0.1:7687
  user: neo4j
  database: neo4j
  extractor_model: en_core_web_sm
  extractor_model_version: 3.8.0
  minimum_relation_confidence: 0.70
  rule_tier_policy: configs/graph_tier_policy.json
  # Deliberately no password. Supply RAGPLAN_GRAPH__PASSWORD at runtime.

logging:
  mode: redacted
  path: /tmp/ragplan/ragplan-trace.jsonl
  max_bytes: 10485760
  file_count: 5
  queue_capacity: 1024
