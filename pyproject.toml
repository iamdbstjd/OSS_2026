[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ragplan"
version = "0.1.0"
description = "Latency-budget-aware retrieval execution optimizer."
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "RAGPlan Contributors" }]
dependencies = [
    "fastapi>=0.141.1,<0.142.0",
    "neo4j>=6.2.0,<7.0.0",
    "pydantic>=2.13.4,<2.14.0",
    "pyyaml>=6.0.3,<7.0.0",
    "qdrant-client>=1.18.0,<1.19.0",
    "sentence-transformers>=5.6.0,<5.7.0",
    "torch>=2.13.0,<2.14.0",
    "typer>=0.27.1,<0.28.0",
    "uvicorn[standard]>=0.52.1,<0.53.0",
]

[project.scripts]
ragplan = "ragplan.cli.app:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29.0",
    "mypy>=2.3.0,<2.4.0",
    "pytest>=9.1.1,<9.2.0",
    "pytest-asyncio>=1.4.0,<1.5.0",
    "ruff>=0.16.2,<0.17.0",
]
benchmark = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.14,<2",
    "skops>=0.13,<1",
]
graph-extraction = [
    "spacy>=3.8.15,<3.9.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ragplan"]

[tool.hatch.build.targets.wheel.force-include]
"configs/plans.yaml" = "ragplan/resources/plans.yaml"
"configs/models/all_minilm_l6_v2.b8903db.manifest.json" = "ragplan/resources/models/all_minilm_l6_v2.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: fast isolated tests",
    "contract: static repository contract tests",
    "integration: tests requiring external services",
    "e2e: end-to-end tests",
    "benchmark: performance or benchmark tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
