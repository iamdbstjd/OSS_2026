name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.12 quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEO4J_PASSWORD: ragplan-ci-ephemeral-password
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Unit tests and import smoke
        run: |
          uv run pytest -m "not integration and not e2e"
          uv run python -c "import ragplan"
          uv run ragplan --version

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build and start local stack
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Smoke-test API health
        run: curl --fail --show-error --silent http://127.0.0.1:8000/health

      - name: Run Stage 3 real-Qdrant integration tests
        run: |
          set -o pipefail
          model_snapshot="$(
            uv run python scripts/prepare_model.py --cache-dir "$RUNNER_TEMP/ragplan-minilm" |
              uv run python -c '
          import json
          import sys

          payload = json.load(sys.stdin)
          snapshot_path = payload.get("snapshot_path")
          if payload.get("status") != "ready" or not isinstance(snapshot_path, str):
              raise SystemExit("prepare_model did not return a ready snapshot path")
          print(snapshot_path)
          '
          )"
          test -d "$model_snapshot"
          export RAGPLAN_TEST_QDRANT_URL="http://127.0.0.1:6333"
          export RAGPLAN_TEST_MODEL_SNAPSHOT="$model_snapshot"
          uv run pytest \
            tests/integration/test_qdrant_vector_backend.py \
            tests/integration/test_vector_vertical_slice.py

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop local stack
        if: always()
        run: docker compose down --volumes --remove-orphans
